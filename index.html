<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b08">
  <title>Пук-машина</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif;
      background: #090b08;
      color: #f2f5e9;
      font-synthesis: none;
      --lime: #c8ff35;
      --muted: #898f7f;
      --panel: #11140f;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 44%, #25301455 0, transparent 43%),
        radial-gradient(circle at 50% 50%, #c8ff3508 1px, transparent 1.5px),
        #090b08;
      background-size: auto, 26px 26px, auto;
    }

    .app {
      position: relative;
      width: min(100% - 32px, 470px);
      padding: 32px 30px 26px;
      overflow: hidden;
      text-align: center;
      border: 1px solid #c8ff352b;
      border-radius: 24px;
      background: linear-gradient(145deg, #141810, #0d100c 72%);
      box-shadow: 0 30px 100px #000b, 0 0 70px #a5e7210d, inset 0 1px #ffffff0b;
    }

    .app::before, .app::after {
      position: absolute;
      width: 56px;
      height: 56px;
      border-color: #c8ff3570;
      border-style: solid;
      content: "";
      pointer-events: none;
    }

    .app::before {
      top: 13px;
      left: 13px;
      border-width: 1px 0 0 1px;
      border-radius: 9px 0 0;
    }

    .app::after {
      right: 13px;
      bottom: 13px;
      border-width: 0 1px 1px 0;
      border-radius: 0 0 9px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: var(--lime);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 12px #c8ff35b3;
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 12vw, 4.2rem);
      font-weight: 950;
      letter-spacing: -.085em;
      line-height: .9;
    }

    h1 span {
      display: block;
      color: var(--lime);
      text-shadow: 0 0 32px #c8ff3529;
    }

    .subtitle {
      margin: 17px 0 24px;
      color: #a4a996;
      font-size: .92rem;
    }

    .button-wrap {
      position: relative;
      width: 224px;
      height: 224px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
    }

    .button-wrap::before, .button-wrap::after {
      position: absolute;
      border: 1px solid #c8ff3527;
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .button-wrap::before { inset: 5px; animation: breathe 3.2s ease-in-out infinite; }
    .button-wrap::after { inset: 16px; border-style: dashed; opacity: .48; }

    .fart-button {
      position: relative;
      z-index: 1;
      display: grid;
      place-content: center;
      gap: 4px;
      width: 164px;
      height: 164px;
      padding: 0;
      border: 1px solid #dcff8b;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #1c2611, #0d110a 72%);
      box-shadow: 0 0 0 7px #c8ff3512, 0 0 36px #a9ff293b, inset 0 0 26px #c8ff3517;
      color: var(--lime);
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .fart-button:hover {
      transform: scale(1.035);
      background: radial-gradient(circle at 50% 30%, #263517, #0d110a 72%);
      box-shadow: 0 0 0 9px #c8ff3517, 0 0 54px #a9ff2959, inset 0 0 32px #c8ff3525;
    }

    .fart-button:active, .fart-button.is-playing {
      transform: scale(.94);
      box-shadow: 0 0 0 4px #c8ff3512, 0 0 22px #a9ff2940, inset 0 0 34px #c8ff3530;
    }

    .fart-button:focus-visible { outline: 3px solid #f2f5e9; outline-offset: 8px; }

    .button-title {
      font-size: 2.4rem;
      font-weight: 950;
      letter-spacing: -.08em;
      line-height: 1;
      text-shadow: 0 0 22px #c8ff3559;
    }

    .button-caption {
      color: #a4c76d;
      font-size: .58rem;
      font-weight: 800;
      letter-spacing: .25em;
    }

    .status {
      min-height: 22px;
      margin: 0 0 22px;
      color: #c4caaf;
      font-size: .85rem;
    }

    .controls {
      padding: 15px 16px 13px;
      border: 1px solid #ffffff10;
      border-radius: 14px;
      background: #ffffff04;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 290px;
      margin: 0 auto;
      color: #c5cbb8;
      font-size: .82rem;
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      border-radius: 9px;
      accent-color: var(--lime);
      cursor: pointer;
    }

    .counter {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: .76rem;
      letter-spacing: .02em;
    }

    .counter strong { color: var(--lime); font-variant-numeric: tabular-nums; }

    @keyframes breathe {
      50% { transform: scale(1.07); opacity: .52; }
    }

    @media (max-width: 380px) {
      .app { padding: 28px 20px 22px; }
      .button-wrap { width: 204px; height: 204px; }
      .fart-button { width: 150px; height: 150px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">Звуковая лаборатория / 001</p>
    <h1>ПУК-<span>МАШИНА</span></h1>
    <p class="subtitle">Нажми кнопку. Пусть звучит.</p>

    <div class="button-wrap">
      <button class="fart-button" id="fart" type="button" aria-label="Издать звук пука">
        <span class="button-title" aria-hidden="true">ПУК</span>
        <span class="button-caption" aria-hidden="true">НАЖМИ</span>
      </button>
    </div>
    <p class="status" id="status" aria-live="polite">Готова к запуску</p>

    <div class="controls">
      <label class="volume" for="volume">
        <span>−</span>
        <input id="volume" type="range" min="0" max="100" value="65" aria-label="Громкость">
        <span>+</span>
      </label>
      <p class="counter">ВСЕГО ЗВУКОВ: <strong id="count">0</strong></p>
    </div>
  </main>

  <script>
    const button = document.querySelector("#fart");
    const status = document.querySelector("#status");
    const volume = document.querySelector("#volume");
    const countLabel = document.querySelector("#count");
    let audioContext;
    let count = 0;

    function makeFart() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) {
        status.textContent = "Этот браузер не поддерживает звук";
        return;
      }

      audioContext ||= new AudioContext();
      audioContext.resume();

      const now = audioContext.currentTime;
      const duration = 1.05 + Math.random() * 0.55;
      const loudness = Number(volume.value) / 100;
      const pitch = 54 + Math.random() * 20;
      const curveLength = 256;
      const pulseCurve = new Float32Array(curveLength);
      const flutterRate = 7 + Math.random() * 3;
      const flutterPhase = Math.random() * Math.PI * 2;
      const wobbleRate = 15 + Math.random() * 8;
      const wobblePhase = Math.random() * Math.PI * 2;

      for (let i = 0; i < curveLength; i++) {
        const progress = i / (curveLength - 1);
        const fade = Math.min(1, progress * 20) * Math.pow(1 - progress, 0.8);
        const flutterWave = (1 + Math.sin(
          progress * duration * flutterRate * Math.PI * 2 + flutterPhase
        )) / 2;
        const wobbleWave = (1 + Math.sin(
          progress * duration * wobbleRate * Math.PI * 2 + wobblePhase
        )) / 2;
        const flutter = 0.08 + 0.72 * Math.pow(flutterWave, 1.6) + 0.2 * wobbleWave;
        pulseCurve[i] = Math.max(0, fade * flutter);
      }

      const length = Math.ceil(audioContext.sampleRate * duration);
      const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const samples = buffer.getChannelData(0);
      let coloredNoise = 0;

      for (let i = 0; i < length; i++) {
        const progress = i / length;
        coloredNoise = coloredNoise * 0.72 + (Math.random() * 2 - 1) * 0.28;
        samples[i] = coloredNoise * Math.max(0, 1 - progress);
      }

      const source = audioContext.createBufferSource();
      const noiseFilter = audioContext.createBiquadFilter();
      const noiseGain = audioContext.createGain();
      const oscillator = audioContext.createOscillator();
      const waveshaper = audioContext.createWaveShaper();
      const rumbleFilter = audioContext.createBiquadFilter();
      const rumbleGain = audioContext.createGain();
      const output = audioContext.createGain();
      const distortion = new Float32Array(256);
      const bubbleCount = 5 + Math.floor(Math.random() * 4);

      for (let i = 0; i < distortion.length; i++) {
        const x = (i * 2) / (distortion.length - 1) - 1;
        distortion[i] = Math.tanh(x * 3);
      }

      source.buffer = buffer;
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.setValueAtTime(520, now);
      noiseFilter.frequency.exponentialRampToValueAtTime(260, now + duration);
      noiseFilter.Q.value = 0.7;
      noiseGain.gain.setValueCurveAtTime(pulseCurve, now, duration);

      oscillator.type = "sawtooth";
      oscillator.frequency.setValueAtTime(pitch, now);
      oscillator.frequency.exponentialRampToValueAtTime(pitch * 0.58, now + duration);
      waveshaper.curve = distortion;
      rumbleFilter.type = "lowpass";
      rumbleFilter.frequency.value = 420;
      rumbleGain.gain.setValueCurveAtTime(pulseCurve, now, duration);
      output.gain.value = loudness * 0.62;

      source.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(output);
      oscillator.connect(waveshaper);
      waveshaper.connect(rumbleFilter);
      rumbleFilter.connect(rumbleGain);
      rumbleGain.connect(output);
      output.connect(audioContext.destination);
      source.start(now);
      source.stop(now + duration);
      oscillator.start(now);
      oscillator.stop(now + duration);

      for (let i = 0; i < bubbleCount; i++) {
        const start = now + 0.08 + Math.random() * (duration - 0.22);
        const bubbleDuration = 0.07 + Math.random() * 0.15;
        const bubble = audioContext.createOscillator();
        const bubbleFilter = audioContext.createBiquadFilter();
        const bubbleGain = audioContext.createGain();
        const bubblePitch = 115 + Math.random() * 125;

        bubble.type = "sine";
        bubble.frequency.setValueAtTime(bubblePitch, start);
        bubble.frequency.exponentialRampToValueAtTime(bubblePitch * 0.48, start + bubbleDuration);
        bubbleFilter.type = "lowpass";
        bubbleFilter.frequency.value = 520;
        bubbleGain.gain.setValueAtTime(0.001, start);
        bubbleGain.gain.linearRampToValueAtTime(loudness * 0.2, start + bubbleDuration * 0.18);
        bubbleGain.gain.exponentialRampToValueAtTime(0.001, start + bubbleDuration);

        bubble.connect(bubbleFilter);
        bubbleFilter.connect(bubbleGain);
        bubbleGain.connect(output);
        bubble.start(start);
        bubble.stop(start + bubbleDuration);
      }

      button.classList.add("is-playing");
      window.setTimeout(() => button.classList.remove("is-playing"), duration * 1000);
      countLabel.textContent = String(++count);
      status.textContent = "Пуууф! Ещё раз?";
    }

    button.addEventListener("click", makeFart);
  </script>
</body>
</html>
